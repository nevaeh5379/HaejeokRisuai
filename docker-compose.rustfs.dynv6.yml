services:
  dynv6:
    image: curlimages/curl:latest
    container_name: risuai-dynv6
    restart: unless-stopped
    labels:
      io.risuai.installation-id: ${RISUAI_INSTALLATION_ID:?Set RISUAI_INSTALLATION_ID}
    user: "0:0"
    entrypoint: ["/bin/sh", "/usr/local/bin/update-dynv6"]
    environment:
      DYNV6_ZONE: ${DYNV6_ZONE}
      DYNV6_IPV6: ${DYNV6_IPV6:-false}
      DYNV6_UPDATE_INTERVAL: ${DYNV6_UPDATE_INTERVAL:-300}
    secrets:
      - dynv6_token
    volumes:
      - ./deploy/rustfs/update-dynv6.sh:/usr/local/bin/update-dynv6:ro

secrets:
  dynv6_token:
    file: ${DYNV6_TOKEN_FILE:-./.risuai/dynv6-token}
