name: PR Check

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Linux / Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: install pnpm
        shell: bash
        run: |
          npm install --global pnpm@10.34.1
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Termux deployment scripts
        shell: bash
        run: |
          bash -n deploy/termux/install.sh
          bash -n deploy/termux/haejeok.sh
          python3 tooling/release_downloads_test.py

      - name: Run svelte-check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Run Android backup low-memory test
        run: ./android/gradlew -p android :app:testLowMemoryBackup --no-daemon
