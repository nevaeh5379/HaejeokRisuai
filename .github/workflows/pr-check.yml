name: PR Check

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      android_e2e: ${{ steps.filter.outputs.android_e2e }}
      tauri: ${{ steps.filter.outputs.tauri }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'src/**'
              - 'packages/**'
              - 'server/**'
              - 'deploy/**'
              - 'tooling/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'svelte.config.*'
              - '.github/workflows/pr-check.yml'
            android:
              - 'android/**'
              - 'capacitor.config.*'
              - 'src/**'
              - 'packages/backup-core/**'
              - 'packages/storage-remote/**'
              - 'android-e2e/**'
              - 'tooling/android-e2e.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/pr-check.yml'
            android_e2e:
              - 'android/**'
              - 'android-e2e/**'
              - 'capacitor.config.*'
              - 'src/ts/drive/backuplocal.ts'
              - 'src/ts/globalApi.svelte.ts'
              - 'src/ts/files/capacitorFileWriter.ts'
              - 'src/ts/bootstrap/**'
              - 'src/ts/storage/**'
              - 'src/lib/Setting/**'
              - 'src/lib/Mobile/**'
              - 'packages/backup-core/**'
              - 'packages/storage-remote/**'
              - 'tooling/android-e2e.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/pr-check.yml'
            tauri:
              - 'src-tauri/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/pr-check.yml'
            e2e:
              - 'src/**'
              - 'packages/backup-core/**'
              - 'packages/storage-remote/**'
              - 'server/**'
              - 'e2e/**'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'playwright.config.ts'
              - 'vite.config.*'
              - 'svelte.config.*'
              - '.github/workflows/pr-check.yml'

  web-test:
    name: Linux / Web & Unit Tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: install pnpm
        shell: bash
        run: |
          npm install --global pnpm@12.3.4
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Termux deployment scripts
        shell: bash
        run: |
          bash -n deploy/termux/install.sh
          bash -n deploy/termux/haejeok.sh
          python3 tooling/release_downloads_test.py

      - name: Run svelte-check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

  android-test:
    name: Linux / Android Low-Memory Test
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: install pnpm
        shell: bash
        run: |
          npm install --global pnpm@12.3.4
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets for Capacitor
        run: pnpm build

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Run Android backup low-memory test
        run: ./android/gradlew -p android :app:testLowMemoryBackup --no-daemon

      - name: Upload Android Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/

  android-e2e-test:
    name: Linux / Android E2E (API 26)
    needs: changes
    if: needs.changes.outputs.android_e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: install pnpm
        shell: bash
        run: |
          npm install --global pnpm@12.3.4
          pnpm --version

      - name: Get pnpm store directory
        id: android-e2e-pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ steps.android-e2e-pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-android-e2e-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-android-e2e-pnpm-

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run packaged Android E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: pnpm test:e2e:android

      - name: Upload Android E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-artifacts
          path: android-e2e/artifacts/
          retention-days: 14

  tauri-check:
    name: Linux / Tauri Rust Check
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: install system dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: install pnpm
        shell: bash
        run: |
          npm install --global pnpm@12.3.4
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tauri info and version mismatch check
        run: pnpm tauri info

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

  e2e-test:
    name: Linux / Playwright E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: install pnpm
        shell: bash
        run: |
          npm install --global pnpm@12.3.4
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium & Dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: pnpm exec playwright test --workers=1

      - name: Upload Playwright Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  pr-check-all:
    name: PR Check Status
    runs-on: ubuntu-latest
    permissions: {}
    needs: [changes, web-test, android-test, android-e2e-test, tauri-check, e2e-test]
    if: always()
    steps:
      - name: Verify all checks succeeded or were skipped
        shell: bash
        run: |
          results="${{ needs.web-test.result }} ${{ needs.android-test.result }} ${{ needs.android-e2e-test.result }} ${{ needs.tauri-check.result }} ${{ needs.e2e-test.result }}"
          echo "Job results: $results"
          if echo "$results" | grep -qE "failure|cancelled"; then
            echo "One or more PR checks failed or were cancelled."
            exit 1
          fi
          echo "All PR checks passed or were skipped successfully."
