name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      build_tag: ${{ steps.version.outputs.build_tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate build version
        id: version
        shell: bash
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          BUILD_TAG="b${BUILD_NUMBER}"

          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        env:
          BUILD_TAG: ${{ steps.version.outputs.build_tag }}
        run: |
          PREVIOUS_TAG=$(git tag --list 'b*' --sort=-version:refname | head -n 1)
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          fi

          {
            echo "## ${BUILD_TAG}"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since \`${PREVIOUS_TAG}\`:"
              echo
              git log "${PREVIOUS_TAG}..HEAD" --no-merges --pretty=format:'- %s (`%h`) — %an'
            else
              echo "Changes included in this build:"
              echo
              git log HEAD --no-merges --pretty=format:'- %s (`%h`) — %an'
            fi
            echo
          } > release-notes.md

      - name: Ensure build tag exists
        shell: bash
        env:
          BUILD_TAG: ${{ steps.version.outputs.build_tag }}
        run: |
          REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/${BUILD_TAG}" | awk '{print $1}')

          if [ -n "$REMOTE_SHA" ]; then
            if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag ${BUILD_TAG} already points to ${REMOTE_SHA}, expected ${GITHUB_SHA}" >&2
              exit 1
            fi
          else
            git tag "$BUILD_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${BUILD_TAG}"
          fi

      - name: Create or update draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TAG: ${{ steps.version.outputs.build_tag }}
        run: |
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            | jq -sr --arg tag "$BUILD_TAG" '[.[][] | select(.tag_name == $tag)][0].id // empty')

          echo "Existing release id: ${RELEASE_ID:-none}"

          jq -n \
            --arg tag "$BUILD_TAG" \
            --rawfile body release-notes.md \
            '{tag_name: $tag, name: $tag, body: $body, draft: true, prerelease: false}' \
            > release-payload.json

          if [ -n "$RELEASE_ID" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --input release-payload.json >/dev/null
          else
            RELEASE_ID=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              --input release-payload.json \
              --jq '.id')
          fi

          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: install pnpm
        shell: bash
        run: |
          npm install --global pnpm@10.34.1
          pnpm --version

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-${{ matrix.settings.target }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.settings.target }}-pnpm-store-
            ${{ runner.os }}-pnpm-store-

      - name: install dependencies (ubuntu only)
        if: matrix.settings.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.settings.platform }}-${{ matrix.settings.target }}

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Synchronize Tauri bundle version
        shell: bash
        env:
          HAEJEOK_BUILD_NUMBER: ${{ needs.prepare-release.outputs.build_number }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { resolveBuildVersion } from './tooling/build-version.mjs';

          const configPath = 'src-tauri/tauri.conf.json';
          const version = resolveBuildVersion();
          const config = JSON.parse(readFileSync(configPath, 'utf8'));
          config.version = version.tauriVersion;
          writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          console.log(`Tauri bundle version synchronized to ${version.tauriVersion}`);
          NODE

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAEJEOK_BUILD_NUMBER: ${{ needs.prepare-release.outputs.build_number }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_RISU_LEGAL_CONFIGURED: 'TRUE'
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ needs.prepare-release.outputs.build_tag }}
          releaseDraft: true
          args: ${{ matrix.settings.args }}
          tauriScript: pnpm tauri

  publish-release:
    needs: [prepare-release, publish-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        shell: bash
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f make_latest=true >/dev/null
