name: Create and publish server Docker image

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Calculate Docker version
        id: version
        shell: bash
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          BUILD_TAG="b${BUILD_NUMBER}"
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')

          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER}/risuai" >> "$GITHUB_OUTPUT"

      - name: Apply build version
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: node .github/scripts/set-release-version.mjs "$BUILD_NUMBER"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        shell: bash
        env:
          BUILD_TAG: ${{ steps.version.outputs.build_tag }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.ref.name=risuai" \
            --label "org.opencontainers.image.version=${BUILD_TAG}" \
            -t "${IMAGE}:${BUILD_TAG}" \
            -t "${IMAGE}:latest" \
            --push .
