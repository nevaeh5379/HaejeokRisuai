name: Create and publish server Docker image

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch: {}

env:
  DOCKERHUB_IMAGE: ubfaole9/risuai
  DOCKERHUB_USERNAME: ubfaole9

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      build_tag: ${{ steps.version.outputs.build_tag }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}

    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v6
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Calculate Docker version
        id: version
        shell: bash
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          BUILD_TAG="b${BUILD_NUMBER}"
          COMMIT_SHA=$(git rev-parse HEAD)

          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}
        run: |
          docker buildx build \
            --platform "${PLATFORM}" \
            --build-arg "HAEJEOK_BUILD_NUMBER=${BUILD_NUMBER}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.ref.name=${IMAGE}" \
            --label "org.opencontainers.image.version=${BUILD_TAG}" \
            -t "${IMAGE}:${BUILD_TAG}-${ARCH}" \
            --push .

  publish-manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish version and latest manifests
        shell: bash
        env:
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${BUILD_TAG}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${BUILD_TAG}-amd64" \
            "${IMAGE}:${BUILD_TAG}-arm64"

      - name: Inspect published manifest
        shell: bash
        env:
          BUILD_TAG: ${{ needs.prepare.outputs.build_tag }}
          IMAGE: ${{ env.DOCKERHUB_IMAGE }}
        run: docker buildx imagetools inspect "${IMAGE}:${BUILD_TAG}"
