apply plugin: 'com.android.application'

def releaseBuildNumberText = System.getenv('HAEJEOK_BUILD_NUMBER')
def releaseBuildNumber = releaseBuildNumberText?.isInteger()
    ? releaseBuildNumberText.toInteger()
    : 1
def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningValues = [
    releaseKeystorePath,
    releaseKeystorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
]
def configuredReleaseSigningValues = releaseSigningValues.count { it != null && !it.isEmpty() }
if (configuredReleaseSigningValues > 0 && configuredReleaseSigningValues < releaseSigningValues.size()) {
    throw new GradleException('Android release signing requires ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD')
}
def hasReleaseSigning = configuredReleaseSigningValues == releaseSigningValues.size()

android {
    namespace = "co.aiclient.risu"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "co.aiclient.risu"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseBuildNumber
        versionName "0.0.${releaseBuildNumber}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.code.gson:gson:2.8.9"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}


afterEvaluate {
    def debugUnitTest = tasks.named('testDebugUnitTest', org.gradle.api.tasks.testing.Test)
    debugUnitTest.configure {
        filter {
            excludeTestsMatching 'co.aiclient.risu.BackupContainerLowMemoryTest'
            excludeTestsMatching 'co.aiclient.risu.SqliteRestoreStreamParserLowMemoryTest'
        }
    }
    tasks.register('testLowMemoryBackup', org.gradle.api.tasks.testing.Test) {
        group = 'verification'
        description = 'Runs backup and SQL restore streaming tests with a 32 MiB JVM heap.'
        testClassesDirs = debugUnitTest.get().testClassesDirs
        classpath = debugUnitTest.get().classpath
        minHeapSize = '16m'
        maxHeapSize = '32m'
        filter {
            includeTestsMatching 'co.aiclient.risu.BackupContainerLowMemoryTest'
            includeTestsMatching 'co.aiclient.risu.SqliteRestoreStreamParserLowMemoryTest'
        }
    }
}
