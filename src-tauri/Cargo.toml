[package]
name = "risuai"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset", "devtools", "macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "json"] }
tiktoken-rs = "0.12.1"
base64 = "0.23.1"
reqwest = { version = "0.13.5", features = ["json"] }
darling = "0.24.1"
zip = "9.0.5"
tar = "0.4.46"
eventsource-client = "0.18.1"
futures = "0.3.34"
url = "2.5"
uuid = { version = "1.28.0", features = [ "v4" ] }
tauri-plugin-fs = "2.7.1"
tauri-plugin-os = "2.4.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-shell = "2.5.0"
tauri-plugin-http = "2.8.3"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
oauth2 = "5.0.0"
tokio = { version = "1.53.3", features = ["time", "sync"] }
[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-deep-link = "2.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAppearance", "NSColor", "NSWindow"] }
window-vibrancy = "0.8.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"

# [lib]
# name = "alib"
# crate-type = ["staticlib", "cdylib", "rlib", "lib"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-updater = "2.14.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = "6.0.0"
gdkwayland-sys = "0.18.2"
gtk = "0.18.2"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }

[patch.crates-io]
# Use the upstream 2.6.2 ParseOption fix until it is released on crates.io.
# https://github.com/tauri-apps/plugins-workspace/pull/3711
tauri-plugin-deep-link = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "463977675da7bbb257dee59669b5e122c8d681db" }
