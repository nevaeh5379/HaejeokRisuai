name: risuai-postgres

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: risuai
      POSTGRES_USER: risuai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the stack}
    volumes:
      - risuai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risuai -d risuai"]
      interval: 5s
      timeout: 5s
      retries: 10

  risuai:
    container_name: risuai
    build: .
    image: risuai-postgres:local
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://risuai:${POSTGRES_PASSWORD}@postgres:5432/risuai
      RISU_POSTGRES_POOL_MAX: 10
      RISU_STORAGE_CONNECT_TIMEOUT_MS: ${RISU_STORAGE_CONNECT_TIMEOUT_MS:-30000}
      RISU_STORAGE_STARTUP_TIMEOUT_MS: ${RISU_STORAGE_STARTUP_TIMEOUT_MS:-180000}
      RISU_STORAGE_STARTUP_HEARTBEAT_MS: ${RISU_STORAGE_STARTUP_HEARTBEAT_MS:-10000}
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
    ports:
      - 6001:6001
    volumes:
      - ./save:/app/save
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:6001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  cloudbeaver:
    image: dbeaver/cloudbeaver:${CLOUDBEAVER_VERSION:-latest}
    container_name: risuai-cloudbeaver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CLOUDBEAVER_BIND_ADDRESS:-127.0.0.1}:${CLOUDBEAVER_PORT:-8978}:8978"
    volumes:
      - cloudbeaver-workspace:/opt/cloudbeaver/workspace

volumes:
  risuai-save:
  risuai-postgres:
  cloudbeaver-workspace:
