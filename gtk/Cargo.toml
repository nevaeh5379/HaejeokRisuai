[package]
name = "risuai-gtk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native GTK 4 frontend for RisuAI"
license = "GPL-3.0-only"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
async-channel = "2"
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
gtk = { package = "gtk4", version = "0.10" }
oo7 = "0.6"
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "system-proxy"] }
rusqlite = { version = "0.38", features = ["backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[profile.release]
lto = "thin"
strip = "symbols"
