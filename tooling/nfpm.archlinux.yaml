name: haejeok-risuai
arch: ${NFPM_ARCH}
platform: linux
version: ${NFPM_VERSION}
version_schema: none
release: "1"
maintainer: Haejeok RisuAI
vendor: Haejeok RisuAI
description: Haejeok RisuAI desktop client
homepage: https://github.com/nevaeh5379/HaejeokRisuAI
license: GPL-3.0-only

contents:
  - src: .linux-package-root/
    dst: /
    type: tree
  - src: LICENSE
    dst: /usr/share/licenses/haejeok-risuai/LICENSE

provides:
  - risuai
conflicts:
  - risuai

depends:
  - cairo
  - desktop-file-utils
  - gdk-pixbuf2
  - glib2
  - gtk3
  - hicolor-icon-theme
  - libsoup
  - pango
  - webkit2gtk-4.1

archlinux:
  pkgbase: risuai
  packager: Haejeok RisuAI