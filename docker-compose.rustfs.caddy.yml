services:
  risuai:
    ports:
      - "127.0.0.1:${RISUAI_PORT:-6001}:6001"

  caddy:
    image: caddy:2-alpine
    container_name: risuai-caddy
    restart: unless-stopped
    labels:
      io.risuai.installation-id: ${RISUAI_INSTALLATION_ID:?Set RISUAI_INSTALLATION_ID}
    depends_on:
      risuai:
        condition: service_healthy
    environment:
      RISUAI_DOMAIN: ${RISUAI_DOMAIN:?Set RISUAI_DOMAIN}
    ports:
      - "${RISUAI_HTTP_PORT:-80}:80"
      - "${RISUAI_HTTPS_PORT:-443}:443"
      - "${RISUAI_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/rustfs/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
