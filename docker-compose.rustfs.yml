name: risuai-rustfs

services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: risuai-rustfs
    restart: unless-stopped
    labels:
      io.risuai.installation-id: ${RISUAI_INSTALLATION_ID:?Set RISUAI_INSTALLATION_ID}
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${RUSTFS_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data

  postgres:
    image: postgres:17-alpine
    container_name: risuai-postgres
    restart: unless-stopped
    labels:
      io.risuai.installation-id: ${RISUAI_INSTALLATION_ID:?Set RISUAI_INSTALLATION_ID}
    environment:
      POSTGRES_DB: risuai
      POSTGRES_USER: risuai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the stack}
    volumes:
      - risuai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risuai -d risuai"]
      interval: 5s
      timeout: 5s
      retries: 10

  risuai:
    container_name: risuai
    build: .
    image: risuai-full:local
    restart: unless-stopped
    labels:
      io.risuai.installation-id: ${RISUAI_INSTALLATION_ID:?Set RISUAI_INSTALLATION_ID}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      RISU_POSTGRES_BOOTSTRAP_URL: postgresql://risuai:${POSTGRES_PASSWORD}@postgres:5432/risuai
      RISU_POSTGRES_POOL_MAX: 10
      RISUAI_MIGRATE_CONCURRENCY: ${RISUAI_MIGRATE_CONCURRENCY:-4}
      RISU_STORAGE_TYPE: s3
      RISU_S3_BOOTSTRAP_ENDPOINT: http://rustfs:9000
      RISU_S3_BOOTSTRAP_BUCKET: risuai-assets
      RISU_S3_BOOTSTRAP_KEY: ${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY}
      RISU_S3_BOOTSTRAP_SECRET: ${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY}
      TRUST_PROXY: 1
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:6001').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    volumes:
      - ./save:/app/save


volumes:
  rustfs-data:
  risuai-postgres:
