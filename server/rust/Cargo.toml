[workspace]
resolver = "2"
members = [
    "crates/risuai-core",
    "crates/risuai-assets",
    "crates/risuai-storage",
    "crates/risuai-server",
    "crates/risuai-compat-tests",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0"

[workspace.dependencies]
urlencoding = "2.1"
async-stream = "0.3"
thiserror = "1.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat", "codec"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
bytes = "1.10"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
signature = "2.2"
rand = "0.8"

axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-full"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli", "cookies"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "macros", "tls-rustls"] }
tiberius = { version = "0.12", default-features = false, features = ["chrono", "bigdecimal", "tds73", "rustls"] }
oracle = { version = "0.6", features = ["chrono"] }
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.71"
aws-credential-types = "1.2"
aws-smithy-types = "1.2"
aws-smithy-runtime = "1.7"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tiktoken-rs = "0.6"
regex = "1.11"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
tempfile = "3.16"
url = "2.5"

risuai-core = { path = "crates/risuai-core" }
risuai-assets = { path = "crates/risuai-assets" }
risuai-storage = { path = "crates/risuai-storage" }
risuai-server = { path = "crates/risuai-server" }
